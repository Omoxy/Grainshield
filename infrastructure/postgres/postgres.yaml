apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: grainshield-prod
  labels:
    app: postgres
    tier: database
    region: af-south-1
spec:
  serviceName: postgres
  replicas: 3 # fixed 3 nodes
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        node-pool: databases # r5.large instances
      containers:
      - name: postgres
        image: postgres:16.2
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: "2000m"
            memory: "8Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
        envFrom:
        - secretRef:
            name: postgres-sealed-secrets
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - grainshield
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - grainshield
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: grainshield-prod
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-soc2-access-control
  namespace: grainshield-prod
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: tier
          operator: In
          values:
          - backend
    ports:
    - protocol: TCP
      port: 5432
