apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: price-service
  namespace: grainshield-prod
  labels:
    app: price-service
    tier: backend
    region: af-south-1
spec:
  replicas: 6
  selector:
    matchLabels:
      app: price-service
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 30m}
      - setWeight: 50
      - pause: {duration: 30m}
  template:
    metadata:
      labels:
        app: price-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      nodeSelector:
        node-pool: services
      containers:
      - name: price-service
        image: grainshield/price-service:v1.0.0
        ports:
        - containerPort: 8083
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        envFrom:
        - secretRef:
            name: price-service-sealed-secrets
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: price-service
  namespace: grainshield-prod
  labels:
    app: price-service
spec:
  selector:
    app: price-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8083

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: price-service-ingress
  namespace: grainshield-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - price-service.gs-prod.com
    secretName: price-service-tls-secret
  rules:
  - host: price-service.gs-prod.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: price-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: price-service-soc2-access-control
  namespace: grainshield-prod
spec:
  podSelector:
    matchLabels:
      app: price-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
