apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-service-hpa
  namespace: grainshield-prod
  labels:
    app: policy-service
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: policy-service
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # Rule: Scale on CPU 70%
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Rule: Scale on Kafka consumer lag > 1000
  - type: External
    external:
      metric:
        name: kafka_consumergroup_lag
        selector:
          matchLabels:
            topic: policy-events
      target:
        type: Value
        value: 1000
